<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baton Pass</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Baton Pass — Handoffs</h1>

  <div class="filters">
    <input id="project" placeholder="Filter by project">
    <input id="person" placeholder="Filter by person">

    <button onclick="loadHandoffs()">Search</button>

  <div id="list"></div>

  <script src="app.js"></script>
</body>
</html>
